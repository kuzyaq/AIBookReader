
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aibookreader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aibookreader_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aibookreader"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_secret_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aibookreader_minio:/data

volumes:
  aibookreader_pg:
  aibookreader_minio:
